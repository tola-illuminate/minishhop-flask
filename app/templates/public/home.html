{% extends 'layouts/base.html' %}

{% block content %}

<h1>MiniShop</h1>

<div class="row">

    {% for product in products %}

    <div class="col-md-4 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>{{ product.name }}</h5>

                <p>${{ product.price }}</p>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
